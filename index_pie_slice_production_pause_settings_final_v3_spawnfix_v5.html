  function resetP1Systems(){
    // Clear transient combat state so swapping player count is always safe for testing.
    lasers.length = 0;
    sparks.length = 0;
    charging = false;
    charge = 0;
    chargeHeld = 0;
    chargeFullBlink = 0;
    chargeLockUntilRelease = false;
    chargeAutoFired = false;

    shootCooldown = 0;

    // Boost state
    prevShiftHeld = false;
    boostCharging = false;
    boostCharge = 0;
    boostLockUntilRelease = false;
    boostDash1Pending = false;
    boostDash1Timer = 0;
    boostCooldown = 0;
    boostFx = 0;
    boostWindowLeft = 0;
    boostWindowT = 0;
    boostSecondUsed = false;
  }

  function setPlayerCount(n){
    const nn = Math.max(1, Math.min(8, (n|0) || 1));
    if (nn === playerCount) return;
    playerCount = nn;
    initPlayers();
    resetP1Systems();
    log('INFO', `Player count set to ${playerCount}`);
  }

  // Hook dropdown
  const playerCountSel = document.getElementById('playerCount');
  if (playerCountSel) {
    playerCountSel.value = String(playerCount);
    playerCountSel.addEventListener('change', () => setPlayerCount(parseInt(playerCountSel.value, 10)));
  }

  initPlayers();

  // ---------------------------
  // Update loop (fixed timestep)
  // ---------------------------
  let last = performance.now();
  let acc = 0;
  const dtFixed = 1/120;

  let perfFrames = 0, perfTimer = 0;

  function step(dt){
    tSec += dt;
    
    // Update lobby overlay timer
    updateLobbyOverlay(dt);

    const p1 = players[0];

    // Arrow-aim override (press left/right) until the mouse moves again.
    if (mouseMoved) {
      aimMode = 'mouse';
      mouseMoved = false;
    }

    const arrowDir = (keys.has('ArrowLeft') ? -1 : 0) + (keys.has('ArrowRight') ? 1 : 0);
    if (arrowDir !== 0) {
      if (aimMode !== 'arrows') {
        aimMode = 'arrows';
        aimAngle = Math.atan2(p1.aimY, p1.aimX);
      }
      const AIM_RATE = 3.6; // rad/sec
      aimAngle = ang01(aimAngle + arrowDir * AIM_RATE * dt);
    } else if (aimMode === 'mouse') {
      // Keep the stored angle in sync so switching feels seamless.
      aimAngle = Math.atan2(p1.aimY, p1.aimX);
    }

    const p1Input = sampleP1();

    // P1 charge shot (Space) + ArrowUp (tap fire / hold charge)
    const spaceHeld = keys.has('Space');

    const arrowUpHeld = keys.has('ArrowUp');
    const arrowUpPressed = arrowUpHeld && !prevArrowUpHeld;
    const arrowUpReleased = !arrowUpHeld && prevArrowUpHeld;
    prevArrowUpHeld = arrowUpHeld;

    if (arrowUpPressed) {
      arrowUpHeldTime = 0;
      arrowUpHoldCharging = false;
    }
    if (arrowUpHeld) {
      arrowUpHeldTime += dt;
      if (!arrowUpHoldCharging && arrowUpHeldTime >= ARROWUP_HOLD_TO_CHARGE) {
        arrowUpHoldCharging = true;
      }
    }

    // Combined hold input for charging (either Space, or ArrowUp after hold threshold)
    const chargeHeldInput = spaceHeld || (arrowUpHeld && arrowUpHoldCharging);

    if (!chargeHeldInput && chargeLockUntilRelease) chargeLockUntilRelease = false;

    if (chargeHeldInput && !charging && !chargeLockUntilRelease) {
      charging = true;
      chargeHeld = 0;
      chargeFullBlink = 0;
      chargeAutoFired = false;
      log('INFO', 'Charge start');
    }
    if (charging && chargeHeldInput) {
      chargeHeld += dt;
      charge = clamp(chargeHeld / CHARGE_TIME, 0, 1);
      if (charge >= 0.999) chargeFullBlink += dt;

      if (charge >= 0.999 && !chargeAutoFired) {
        spawnLaserFromP1(1.0);
        shootCooldown = Math.max(shootCooldown, 0.18);
        chargeAutoFired = true;
        chargeLockUntilRelease = true;
        charging = false;
        charge = 0;
        chargeHeld = 0;
        chargeFullBlink = 0;
        log('INFO', 'Charge auto-fire (100%)');
      }
    }

    // ArrowUp tap = click shot (only if we did NOT enter hold-to-charge)
    // (We do this on release so a quick tap fires once.)
    if (arrowUpReleased && !arrowUpHoldCharging && !charging) {
      if (shootCooldown <= 0) {
        spawnLaserFromP1(0.15);
        shootCooldown = LASER_COOLDOWN;
      }
    }

    // Release charge when neither input is held anymore
    if (!chargeHeldInput && charging) {
      if (charge >= 0.20) {
        spawnLaserFromP1(charge);
        shootCooldown = Math.max(shootCooldown, 0.18);
      }
      charging = false;
      charge = 0;
      chargeHeld = 0;
      chargeFullBlink = 0;
      log('INFO', 'Charge release');
    }

    // P1 fire
    shootCooldown = Math.max(0, shootCooldown - dt);
    const mousePressed = mouseDown && !prevMouseDown;
    const gpPressed = p1Input.gpFire && !prevP1GpFire;
    if (!charging && (mousePressed || gpPressed) && shootCooldown <= 0) {
      spawnLaserFromP1(0.15);
      shootCooldown = LASER_COOLDOWN;
    }
    prevMouseDown = mouseDown;
    prevP1GpFire = p1Input.gpFire;

    // Movement tuning
    const SPEED = 420;
    const SNAPPY = 18.0;

    // --- Update each player ---
    for (let i=0;i<players.length;i++){
      const p = players[i];

      // Inputs
      let move = {x:0,y:0,mag:0};
      let aim = {x:p.aimX,y:p.aimY,active:false};
      let hasControl = false;

      if (i === 0) {
        move = p1Input.move;
        aim = p1Input.aim;
        hasControl = true;
      } else {
        // Players 2-4: prefer gamepads 1-3 (indices 1..3)
        const gp = sampleGamepadForPlayer(i, i-1); // P1 is keyboard/mouse; P2.. map to pads 0.. (no double-control)
        if (gp) {
          move = gp.move;
          aim = gp.aim;
          hasControl = true;
        }
      }

      // Fallback: drift so you still see 4 players even without controllers
      if (!hasControl) {
        p.driftT += dt;
        const mid = (p.angMin + p.angMax) * 0.5;
        const wob = 0.30 * Math.sin(p.driftT * (0.55 + 0.12*p.id));
        const ang = mid + wob;
        const a = arena();
        const rr = a.r * (0.40 + 0.06*Math.sin(p.driftT * 0.9 + p.id));
        const tx = a.cx + Math.cos(ang) * rr;
        const ty = a.cy + Math.sin(ang) * rr;
        const ddx = tx - p.x;
        const ddy = ty - p.y;
        const n = norm(ddx,ddy);
        move = { x: n.x, y: n.y, mag: clamp(n.l/80,0,0.55) };
        aim = { x: Math.cos(ang), y: Math.sin(ang), active: true };
      }

      // Remember last meaningful move direction
      if (move.mag > 0.18) {
        p.lastMoveX = move.x;
        p.lastMoveY = move.y;
      }

      // Velocity chase
      const targetVx = move.x * SPEED;
      const targetVy = move.y * SPEED;
      p.vx += (targetVx - p.vx) * (SNAPPY * dt);
      p.vy += (targetVy - p.vy) * (SNAPPY * dt);

      // P1 boost (Shift): uses last move dir
      if (i === 0) {
        boostCooldown = Math.max(0, boostCooldown - dt);
        boostFx = Math.max(0, boostFx - dt);

        const shiftHeld = keys.has('ShiftLeft') || keys.has('ShiftRight');
        const shiftPressed = shiftHeld && !prevShiftHeld;
        const shiftReleased = !shiftHeld && prevShiftHeld;
        prevShiftHeld = shiftHeld;

        if (shiftReleased && boostLockUntilRelease) boostLockUntilRelease = false;

        const doDash = (impulse, label) => {
          const dir = norm(p.lastMoveX, p.lastMoveY);
          const bx = (dir.l > 1e-6) ? dir.x : p.aimX;
          const by = (dir.l > 1e-6) ? dir.y : p.aimY;
          p.vx += bx * impulse;
          p.vy += by * impulse;
          boostFx = BOOST_FX_TIME;
          playBoost();
          log('INFO', label);
        };

        if (shiftPressed && !boostLockUntilRelease && boostCooldown <= 0 && boostWindowLeft <= 0 && !boostDash1Pending) {
          boostDash1Pending = true;
          boostDash1Timer = BOOST_START_DELAY;
          boostCharging = true;
          boostCharge = 0;
        }

        if (boostDash1Pending && shiftReleased) {
          boostDash1Pending = false;
          boostDash1Timer = 0;
          boostCharging = false;
          boostCharge = 0;
        }

        if (boostDash1Pending) {
          boostDash1Timer = Math.max(0, boostDash1Timer - dt);
          boostCharge = 1 - (boostDash1Timer / BOOST_START_DELAY);
          if (boostDash1Timer <= 0) {
            boostDash1Pending = false;
            doDash(BOOST_IMPULSE_MIN, 'Boost dash (1)');
            boostWindowLeft = BOOST_DOUBLE_WINDOW;
            boostWindowT = 0;
            boostSecondUsed = false;
            boostCharge = 0;
          }
        }
        if (boostWindowLeft > 0) {
          boostWindowLeft = Math.max(0, boostWindowLeft - dt);
          boostWindowT += dt;
          boostCharge = clamp(boostWindowT / BOOST_DOUBLE_WINDOW, 0, 1);

          // Second dash behavior:
          // - Press Shift again within the window => dash (2)
          // - Hold Shift => auto dash (2) after a short delay (clean double-dash)
          if (!boostSecondUsed) {
            if (shiftPressed && boostWindowT > 0.02) {
              boostSecondUsed = true;
              doDash(BOOST_IMPULSE_MAX, 'Boost dash (2)');
              boostWindowLeft = 0;
            } else if (shiftHeld && boostWindowT >= BOOST_HOLD_TO_DOUBLE_DELAY) {
              boostSecondUsed = true;
              doDash(BOOST_IMPULSE_MAX, 'Boost dash (2)');
              boostWindowLeft = 0;
            }
          }

          // Window ends naturally; we do NOT cancel it on release (so you can tap-tap).
          if (boostWindowLeft <= 0) {

            boostCharging = false;
            boostCharge = 0;
            boostCooldown = BOOST_COOLDOWN;
            boostLockUntilRelease = shiftHeld;
          }
        }
      }

      // Integrate position
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // Aim persistence
      if (aim.active) {
        p.aimX = aim.x;
        p.aimY = aim.y;
      }

      // Slice constraints
      constrainToSlice(p);

      // One barrier per slice (inside each slice)
      collidePlayerWithBarrier(p);

      // Trail
      p.trail.push({x:p.x, y:p.y});
      if (p.trail.length > p.trailMax) p.trail.shift();
    }

    // Lasers update + ricochet off screen edges
    const minX = LASER_RADIUS;
    const maxX = canvas.width  - LASER_RADIUS;
    const minY = LASER_RADIUS;
    const maxY = canvas.height - LASER_RADIUS;

    for (let i = lasers.length - 1; i >= 0; i--) {
      const L = lasers[i];
      L.px = L.x;
      L.py = L.y;
      L.x += L.vx * dt;
      L.y += L.vy * dt;
      L.life += dt;

      let bounced = false;

      // Barrier ricochet (one per slice). Check movement segment vs each barrier.
      // Kept lightweight: first hit only per step.
      if (barriers.length) {
        for (const B of barriers) {
          const t = segmentsIntersect(L.px, L.py, L.x, L.y, B.x0, B.y0, B.x1, B.y1);
          if (t !== null) {
            const hx = L.px + (L.x - L.px) * t;
            const hy = L.py + (L.y - L.py) * t;
            // Segment normal
            const sx = B.x1 - B.x0;
            const sy = B.y1 - B.y0;
            let nx = -sy, ny = sx;
            const nn = Math.hypot(nx,ny) || 1;
            nx /= nn; ny /= nn;
            // Flip normal to face incoming velocity
            if (L.vx*nx + L.vy*ny > 0) { nx = -nx; ny = -ny; }
            const rv = reflectVelocity(L.vx, L.vy, nx, ny, 0.90);
            L.vx = rv.vx;
            L.vy = rv.vy;
            const sp = Math.hypot(L.vx, L.vy) || 1;
            L.dirX = L.vx / sp;
            L.dirY = L.vy / sp;
            // Nudge out of barrier
            L.x = hx + L.dirX * 2.0;
            L.y = hy + L.dirY * 2.0;
            bounced = true;
            break;
          }
        }
      }

      if (L.x <= minX) { L.x = minX + (minX - L.x); L.vx = Math.abs(L.vx) * 0.90; bounced = true; }
      else if (L.x >= maxX) { L.x = maxX - (L.x - maxX); L.vx = -Math.abs(L.vx) * 0.90; bounced = true; }

      if (L.y <= minY) { L.y = minY + (minY - L.y); L.vy = Math.abs(L.vy) * 0.90; bounced = true; }
      else if (L.y >= maxY) { L.y = maxY - (L.y - maxY); L.vy = -Math.abs(L.vy) * 0.90; bounced = true; }

      if (bounced) {
        if ((L.bouncesLeft|0) > 0) {
          L.bouncesLeft--;
          const sp = Math.hypot(L.vx, L.vy) || 1;
          L.dirX = L.vx / sp;
          L.dirY = L.vy / sp;
          playRicochetSfx();
          spawnExplosion(L.x, L.y, 0.22 + 0.25*L.power);
        } else {
          spawnExplosion(L.x, L.y, 0.65 + 0.55*L.power);
          playRicochetSfx();
          lasers.splice(i, 1);
          continue;
        }
      }

      if (L.safeTime !== undefined) L.safeTime = Math.max(0, L.safeTime - dt);
      // Player hits
      const PLAYER_HIT_R = 18;
      if (!L.noSelfHit && ((L.safeTime ?? 0) <= 0)) {
        if (gameMode === 'VS') {
          let removed = false;
          for (const p of players) {
            if (!p.alive) continue;
            // Self-hit only after first bounce, just like SNIP3.
            if (p.id === (L.ownerId ?? -999) && ((L.bouncesLeft|0) >= 2)) continue;
            const tHit = intersectSegmentCircle(L.px, L.py, L.x, L.y, p.x, p.y, PLAYER_HIT_R);
            if (tHit !== null) {
              const hx = L.px + (L.x - L.px) * tHit;
              const hy = L.py + (L.y - L.py) * tHit;
              eliminatePlayer(p, hx, hy, (L.ownerId ?? -1));
              lasers.splice(i, 1);
              removed = true;
              break;
            }
          }
          if (removed) continue;
        } else {
          // SNIP3: only P1 self-hit after at least one bounce.
          if (((L.bouncesLeft|0) < 2)) {
            const tHit = intersectSegmentCircle(L.px, L.py, L.x, L.y, players[0].x, players[0].y, PLAYER_HIT_R);
            if (tHit !== null) {
              const hx = L.px + (L.x - L.px) * tHit;
              const hy = L.py + (L.y - L.py) * tHit;
              triggerSelfHit(hx, hy);
              lasers.splice(i, 1);
              continue;
            }
          }
        }
      }

      const out = (L.x < -200 || L.y < -200 || L.x > canvas.width + 200 || L.y > canvas.height + 200);
      if (L.life >= L.maxLife || out) lasers.splice(i, 1);
    }

    updateSparks(dt);
  }

  // Perf summaries
  function logPerf(ms, fps){ log('INFO', `Perf: ${fps.toFixed(1)} fps, ${(ms).toFixed(2)} ms/frame (avg)`); }

  window.addEventListener('gamepadconnected', (e) => log('INFO', `Gamepad connected: ${e.gamepad.id}`));
  window.addEventListener('gamepaddisconnected', (e) => log('INFO', `Gamepad disconnected: ${e.gamepad.id}`));

  // ---------------------------
  // Main loop
  // ---------------------------
  function frameLoop(){
    const now = performance.now();
    // Always update audio debug panel (cheap).
    updateAudioStatus();
    let dt = (now - last) / 1000;
    last = now;
    dt = Math.min(dt, 0.05);
    acc += dt;

    // ---------------------------
    // Update (fixed timestep) — GAME only
    // ---------------------------
    if (appMode === 'GAME') {
      while (acc >= dtFixed) {
        step(dtFixed);
        acc -= dtFixed;
      }
    } else {
      // Avoid spiral when sitting on menu/boot.
      acc = 0;
    }

    // ---------------------------
    // Render by mode
    // ---------------------------
    if (appMode === 'BOOT_WAIT') {
       // Allow controllers to "press anything" without clicking.
       if (anyGamepadPressed()) firstInteraction();
      drawBootWait(now);
      requestAnimationFrame(frameLoop);
      return;
    }

    if (appMode === 'BOOT') {
      drawBootScreen(now);
      requestAnimationFrame(frameLoop);
      return;
    }

    if (appMode === 'MENU') {
      // menu navigation (edge-triggered)
      const up = keys.has('ArrowUp');
      const down = keys.has('ArrowDown');
      const enter = keys.has('Enter');
      const left = keys.has('ArrowLeft');
      const right = keys.has('ArrowRight');
      const esc = keys.has('Escape');

      // Controller navigation (D-pad / left stick) + A/Start to select
      let gpUp = false, gpDown = false, gpLeft = false, gpRight = false, gpSelect = false, gpBack = false;
      const pads = getConnectedGamepads();
      if (pads.length) {
        const gp = pads[0].pad;
        const ay = (gp.axes && gp.axes.length) ? gp.axes[1] : 0;
        gpUp = (gp.buttons && gp.buttons[12] && gp.buttons[12].pressed) || (ay < -0.55);
        gpDown = (gp.buttons && gp.buttons[13] && gp.buttons[13].pressed) || (ay > 0.55);
        gpLeft  = (gp.buttons && gp.buttons[14] && gp.buttons[14].pressed) || ((gp.axes&&gp.axes.length)? gp.axes[0] < -0.55 : false);
        gpRight = (gp.buttons && gp.buttons[15] && gp.buttons[15].pressed) || ((gp.axes&&gp.axes.length)? gp.axes[0] >  0.55 : false);
        gpSelect = (gp.buttons && ((gp.buttons[0] && gp.buttons[0].pressed) || (gp.buttons[9] && gp.buttons[9].pressed)));
        gpBack = (gp.buttons && ((gp.buttons[1] && gp.buttons[1].pressed) || (gp.buttons[8] && gp.buttons[8].pressed)));
      }

      const items = menuItems();

      // Left/Right adjustments (Settings sliders)
      const cur = items[menuSel];
      if (menuPage === 'SETTINGS') {
        if ((left || gpLeft) && !(prevMenuLeft || prevGpLeft)) { if (cur && cur.onLeft) { cur.onLeft(); playMenuSwitchSfx(); } }
        if ((right || gpRight) && !(prevMenuRight || prevGpRight)) { if (cur && cur.onRight) { cur.onRight(); playMenuSwitchSfx(); } }
      }


      if ((up || gpUp) && !(prevMenuUp || prevGpUp)) menuSel = (menuSel - 1 + items.length) % items.length;
      if ((down || gpDown) && !(prevMenuDown || prevGpDown)) menuSel = (menuSel + 1) % items.length;
      if ((enter || gpSelect) && !(prevMenuEnter || prevGpSelect)) { playMenuSelectSfx(); items[menuSel].action(); }
      if ((esc && !prevMenuEsc) || (gpBack && !prevGpBack)) {
        if (menuPage !== 'MAIN') { menuPage = 'MAIN'; menuSel = 0; playMenuSwitchSfx(); }
      }      // Credits: press anything to return (with a small debounce so the key that opened Credits doesn't instantly close it)
      if (menuPage === 'CREDITS' && (performance.now() - menuPageEnterT0) > 250) {
        const anyJust =
          (up && !prevMenuUp) || (down && !prevMenuDown) || (left && !prevMenuLeft) || (right && !prevMenuRight) ||
          (enter && !prevMenuEnter) || (esc && !prevMenuEsc) ||
          (gpUp && !prevGpUp) || (gpDown && !prevGpDown) || (gpLeft && !prevGpLeft) || (gpRight && !prevGpRight) ||
          (gpSelect && !prevGpSelect) || (gpBack && !prevGpBack) ||
          (mouseDown && !menuClickDown);
        if (anyJust) { menuPage = 'MAIN'; menuSel = 0; menuPageEnterT0 = performance.now(); playMenuSwitchSfx(); }
      }
      prevMenuUp = up; prevMenuDown = down; prevMenuEnter = enter; prevMenuLeft = left; prevMenuRight = right; prevMenuEsc = esc;
      prevGpUp = gpUp; prevGpDown = gpDown; prevGpSelect = gpSelect; prevGpLeft = gpLeft; prevGpRight = gpRight; prevGpBack = gpBack;

      // mouse hover selects item; click activates
      const layout = menuLayout(menuPage, items.length);
      const fb = fbFromClient(mouseX, mouseY);
      const fbX = fb.x;
      const fbY = fb.y;
      const hoverIdx = Math.round((fbY - layout.baseY) / layout.stepY);
      if (fbX >= layout.left && fbX <= layout.right && hoverIdx >= 0 && hoverIdx < items.length) {
        menuSel = hoverIdx;
      }

      // Click/drag
      if (mouseDown && !menuClickDown) {
        menuClickDown = true;
        menuDragKey = null;
        if (fbX >= layout.left && fbX <= layout.right && hoverIdx >= 0 && hoverIdx < items.length) {
          const it = items[menuSel];
          if (menuPage === 'SETTINGS' && it.kind === 'slider' && typeof it.dragFn === 'function') {
            menuDragKey = it.key;
          } else {
            playMenuSelectSfx();
            it.action();
          }
        }
      }

      // While dragging, continuously update slider from mouse X.
      if (mouseDown && menuDragKey && menuPage === 'SETTINGS') {
        const it = items[menuSel];
        if (it && it.kind === 'slider' && it.key === menuDragKey && typeof it.dragFn === 'function') {
          const t = clamp((fbX - layout.sliderLeft) / (layout.sliderRight - layout.sliderLeft), 0, 1);
          it.dragFn(t);
        }
      }

      if (!mouseDown) {
        menuClickDown = false;
        menuDragKey = null;
      }

      // Play switch sound exactly when the selection changes.
      if (menuSel !== prevMenuSel) {
        playMenuSwitchSfx();
        prevMenuSel = menuSel;
      }

      drawMenuScreen(now);
      requestAnimationFrame(frameLoop);
      return;
    }

    if (appMode === 'VICTORY') {
      victoryTimer = (now - victoryEnterT0) * 0.001;
      // Press anything to return to menu (debounced a little)
      const pads = getConnectedGamepads();
      const gpAny = pads.some(p => p.pad.buttons && p.pad.buttons.some(b => b && b.pressed));
      const keyAny = keys.size > 0;
      const mouseAny = mouseDown;
      if (victoryTimer > 0.25 && (gpAny || keyAny || mouseAny)) {
        // clear keys so we don't immediately re-trigger actions
        keys.clear();
        appMode = 'MENU';
        menuPage = 'MAIN';
        menuSel = 0;
        menuPageEnterT0 = performance.now();
        playMenuSwitchSfx();
        startMenuMusic();
      }
      drawVictoryScreen(now);
      requestAnimationFrame(frameLoop);
      return;
    }


    if (appMode === 'PAUSE') {
      // Pause navigation (does not advance simulation)
      const up = keys.has('ArrowUp');
      const down = keys.has('ArrowDown');
      const enter = keys.has('Enter');
      const esc = keys.has('Escape');

      // Controller (A/Start select, B/Back resume)
      let gpUp = false, gpDown = false, gpSelect = false, gpBack = false;
      const pads = getConnectedGamepads();
      if (pads.length) {
        const gp = pads[0].pad;
        const ay = (gp.axes && gp.axes.length) ? gp.axes[1] : 0;
        gpUp = (gp.buttons && gp.buttons[12] && gp.buttons[12].pressed) || (ay < -0.55);
        gpDown = (gp.buttons && gp.buttons[13] && gp.buttons[13].pressed) || (ay > 0.55);
        gpSelect = (gp.buttons && ((gp.buttons[0] && gp.buttons[0].pressed) || (gp.buttons[9] && gp.buttons[9].pressed)));
        gpBack = (gp.buttons && ((gp.buttons[1] && gp.buttons[1].pressed) || (gp.buttons[8] && gp.buttons[8].pressed)));
      }

      const items = pauseItems();
      if ((up || gpUp) && !(prevMenuUp || prevGpUp)) pauseSel = (pauseSel - 1 + items.length) % items.length;
      if ((down || gpDown) && !(prevMenuDown || prevGpDown)) pauseSel = (pauseSel + 1) % items.length;
      if ((enter || gpSelect) && !(prevMenuEnter || prevGpSelect)) { playMenuSelectSfx(); items[pauseSel].action(); }
      if ((esc && !prevMenuEsc) || (gpBack && !prevGpBack)) {
        // Resume
        appMode = 'GAME';
        keys.delete('Escape');
      }

      prevMenuUp = up; prevMenuDown = down; prevMenuEnter = enter; prevMenuEsc = esc;
      prevGpUp = gpUp; prevGpDown = gpDown; prevGpSelect = gpSelect; prevGpBack = gpBack;

      // Render the world as-is (no stepping), then overlay.
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000';
      ctx.fillRect(0,0,canvas.width, canvas.height);

      drawCrosshair();
      drawArenaRing();
      drawPlayerSlices();
      drawBarriers();

      if (settings.seedOverlay) {
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        const px = Math.floor(Math.min(canvas.width, canvas.height) * 0.020);
        ctx.font = `600 ${px}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
        ctx.fillStyle = `rgba(255,255,255,0.55)`;
        ctx.fillText(`SEED: ${currentSeed}`, 14, 14);
      }

      for (const p of players) drawPlayerTrail(p);
      drawLasers();
      drawSparks();
      for (let i=0;i<players.length;i++) drawPlayerShip(players[i], i===0);
      drawTouchSticks();
      applyBrightnessPass();

      drawPauseOverlay(now);
      requestAnimationFrame(frameLoop);
      return;
    }

    // ---------------------------
    // GAME render (existing)
    // ---------------------------
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,canvas.width, canvas.height);

    // Player-only shake (P1) — charge only (no boost shake)
    playerShakeX = 0;
    playerShakeY = 0;
    sliceShakeAng = 0;

    if (charging) {
      const t = now * 0.001;

        const full = charge >= 0.999;
        const freq = full ? 80 : 40;
        const ampBase = 0.22 + 1.05*charge; // subtle
        const amp = full ? ampBase * 1.15 : ampBase;
        let sx = Math.sin(t*freq*1.00) * amp + Math.sin(t*freq*2.07) * (amp*0.55);
        let sy = Math.cos(t*freq*1.13) * amp + Math.sin(t*freq*1.71) * (amp*0.45);
        if (full) {
          const pulse = 0.6 + 0.4*Math.sin(chargeFullBlink * 22);
          sx *= pulse;
          sy *= pulse;
        }
        playerShakeX += sx;
        playerShakeY += sy;

      playerShakeX = clamp(playerShakeX, -3, 3);
      playerShakeY = clamp(playerShakeY, -3, 3);

      // Visual-only wedge jitter: shake the whole slice slightly while charging.
      // Kept tiny so seams remain readable.
      const sAmp = (0.0008 + 0.0032*charge) * (full ? 1.35 : 1.0);
      sliceShakeAng = (Math.sin(t*55) + Math.sin(t*91)*0.5) * sAmp;
    }

    drawCrosshair();
    drawArenaRing();
    drawPlayerSlices();
    drawBarriers();

    // Seed overlay (always available even when debug HUD hidden)
    if (settings.seedOverlay) {
      const age = performance.now() - seedT0;
      if (age < 6500) {
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        const px = Math.floor(Math.min(canvas.width, canvas.height) * 0.020);
        ctx.font = `600 ${px}px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace`;
        const a = 0.55 * (1 - (age/6500));
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fillText(`SEED: ${currentSeed}`, 14, 14);
      }
    }

    for (const p of players) drawPlayerTrail(p);

    drawLasers();
    drawSparks();

    // Draw players on top
    for (let i=0;i<players.length;i++) {
      drawPlayerShip(players[i], i===0);
    }

    drawTouchSticks();
    drawLobbyOverlay(); // NEW: Draw lobby overlay if visible

    applyBrightnessPass();

    // ESC toggles pause (does not reset the run)
    if (keys.has('Escape')) {
      appMode = 'PAUSE';
      pauseSel = 0;
      pauseEnterT0 = performance.now();
      keys.delete('Escape');
    }

    // perf tracking
    perfFrames += 1;
    perfTimer += dt;
    if (perfTimer >= 5.0) {
      const fps = perfFrames / perfTimer;
      const ms = (perfTimer / perfFrames) * 1000;
      logPerf(ms, fps);
      perfFrames = 0; perfTimer = 0;
    }

    requestAnimationFrame(frameLoop);
  }

  log('INFO', 'Starting main loop');
  requestAnimationFrame(frameLoop);
})();
</script>
