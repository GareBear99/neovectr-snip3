<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>NEO-VECTR — Pure Code Prototype (HTML)</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
    canvas { display:block; width:100vw; height:100vh; image-rendering: pixelated; }
    #hud {
      position: fixed; left: 10px; top: 10px; z-index: 10;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      color: rgba(200,255,255,0.9);
      user-select: none;
      background: rgba(0,0,0,0.25);
      padding: 8px 10px;
      border: 1px solid rgba(120,255,255,0.12);
      border-radius: 10px;
      backdrop-filter: blur(4px);
      max-width: min(580px, calc(100vw - 20px));
    }
    #hud .row { display:flex; gap:10px; flex-wrap: wrap; }
    #hud kbd {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-bottom-color: rgba(255,255,255,0.18);
      padding: 1px 6px;
      border-radius: 6px;
      color: rgba(255,255,255,0.9);
    }
    #log {
      margin-top: 8px;
      max-height: 180px;
      overflow: auto;
      white-space: pre-wrap;
      color: rgba(220,220,220,0.85);
      border-top: 1px solid rgba(120,255,255,0.10);
      padding-top: 8px;
    }
    #btns { margin-top: 8px; display:flex; gap:8px; flex-wrap: wrap; }
    button {
      font: inherit;
      color: rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,0.12); }
    #touchHint { margin-top: 6px; color: rgba(255,170,255,0.85); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="row" style="align-items:center; gap:10px">
      <div><b>NEO-VECTR INC</b> — ∞SNIP3 pie-slice prototype (HTML)</div>
      <div style="opacity:0.9">Players:
        <select id="playerCount" style="margin-left:6px; font:inherit; color:rgba(255,255,255,0.9); background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); padding:2px 6px; border-radius:8px;">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
        </select>
      </div>
    </div>
    <div class="row" style="margin-top:6px">
      <div><kbd>WASD</kbd> move (P1)</div>
      <div><kbd>Mouse</kbd> aim / fire (P1 ricochet)</div>
      <div><kbd>Space</kbd> charge shot (P1)</div>
      <div><kbd>Shift</kbd> boost (P1)</div>
      <div><kbd>Gamepads</kbd> up to 4 players</div>
      <div><kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> quality</div>
      <div><kbd>L</kbd> toggle log</div>
    </div>
    <div id="touchHint">Touch: left side move, right side aim (P1 only) • Other players: gamepads or idle drift</div>
    <div id="audioStatus" style="margin-top:6px;color:rgba(180,220,255,0.85)"></div>
    <div id="btns">
      <button id="dlLog">Download log</button>
      <button id="showPrev">Show previous</button>
      <button id="clearLogs">Clear logs</button>
    </div>
    <div id="log"></div>
    <div id="err" style="display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,80,80,0.20);color:rgba(255,120,120,0.95);white-space:pre-wrap"></div>
  </div>

<script>

// ===============================
//  Audio Manager (seamless loops, gesture-gated)
// ===============================

// Pending audio play requests (flushed after first user gesture)
let _pendingPlays = [];

let AUDIO = {
  ctx: null,
  unlocked: false,
  buffers: new Map(),
  playing: new Map(),
  masterGain: null,
  ensureCtx(){
    if (this.ctx) return this.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    this.ctx = new AC();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0.9;
    this.masterGain.connect(this.ctx.destination);
    return this.ctx;
  },
  async unlockFromUserGesture(){
    try{
      const ctx = this.ensureCtx();
      if(!ctx) return false;
      if (ctx.state !== 'running') await ctx.resume();
      // tiny silent blip to fully unlock on iOS
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      g.gain.value = 0.0001;
      o.connect(g); g.connect(this.masterGain);
      o.start(); o.stop(ctx.currentTime + 0.02);
      this.unlocked = true;
      return true;
    }catch(e){
      this.unlocked = false;
      return false;
    }
  },
  async loadBuffer(key, urlList){
    if(this.buffers.has(key)) return this.buffers.get(key);
    const ctx = this.ensureCtx();
    if(!ctx) return null;
    for (const url of urlList){
      try{
        const res = await fetch(url, {cache:'no-store'});
        if(!res.ok) throw new Error('HTTP '+res.status);
        const ab = await res.arrayBuffer();
        const buf = await ctx.decodeAudioData(ab.slice(0));
        this.buffers.set(key, buf);
        return buf;
      }catch(e){
        // keep trying
      }
    }
    return null;
  },
  stop(key){
    const s = this.playing.get(key);
    if(s){
      try{s.stop(0);}catch(_){ }
      try{s.disconnect();}catch(_){ }
      this.playing.delete(key);
    }
  },
  playLoop(key, buf, {volume=1.0, startAt=0} = {}){
    const ctx = this.ensureCtx();
    if(!ctx || !buf || !this.unlocked) return null;
    this.stop(key);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const g = ctx.createGain();
    g.gain.value = Math.max(0, Math.min(1.5, volume));
    src.connect(g);
    g.connect(this.masterGain);
    src.start(0, startAt % Math.max(0.001, buf.duration));
    this.playing.set(key, src);
    return src;
  }
};

function installAudioUnlockHooks(logFn){
  const once = async (ev)=>{
    window.removeEventListener('pointerdown', once, true);
    window.removeEventListener('keydown', once, true);
    const ok = await AUDIO.unlockFromUserGesture();
    if(logFn) logFn(ok ? 'AUDIO: unlocked (user gesture)' : 'AUDIO: unlock failed');
  };
  window.addEventListener('pointerdown', once, true);
  window.addEventListener('keydown', once, true);
}
(() => {
  'use strict';

  // ---------------------------
  // Safety: storage + crash visibility
  // ---------------------------
  const errEl = document.getElementById('err');
  function showError(text){
    try {
      if (!errEl) return;
      errEl.style.display = 'block';
      errEl.textContent = String(text);
    } catch {}
  }

  window.addEventListener('error', (e) => {
    const msg = (e && (e.message || e.error)) ? (e.message || String(e.error)) : 'Unknown error';
    showError('JS Error: ' + msg + (e && e.filename ? ('\n' + e.filename + ':' + e.lineno + ':' + e.colno) : ''));
  });
  window.addEventListener('unhandledrejection', (e) => {
    showError('Promise rejection: ' + (e && e.reason ? String(e.reason) : 'Unknown'));
  });

  const STORE = (() => {
    const mem = new Map();
    let ls = null;
    try {
      ls = window.localStorage;
      const k = '__th_storage_test__';
      ls.setItem(k, '1');
      ls.removeItem(k);
    } catch {
      ls = null;
    }
    return {
      ok: !!ls,
      get(key){
        try { if (ls) return ls.getItem(key); } catch {}
        return mem.get(key) ?? null;
      },
      set(key, val){
        try { if (ls) return ls.setItem(key, val); } catch {}
        mem.set(key, val);
      },
      remove(key){
        try { if (ls) return ls.removeItem(key); } catch {}
        mem.delete(key);
      }
    };
  })();

  // ---------------------------
  // Log rotation
  // ---------------------------
  const LS_LATEST = 'NEO-VECTR_log_latest';
  const LS_PREV   = 'NEO-VECTR_log_previous';
  const LS_META   = 'NEO-VECTR_log_meta';
  const LS_SETTINGS = 'NEO-VECTR_settings_v1';
  const settings = {
    brightness: 0.00,      // -0.30..+0.30 (post-pass overlay)
    musicVol: 0.70,        // 0..1
    sfxVol: 0.85,          // 0..1
    // NEW: Granular sound controls
    sfxLaserFire: true,      // Your laser shots
    sfxLaserRicochet: true,  // Bounce sounds
    sfxBoost: true,          // Boost dash
    sfxExplosions: true,      // Zap/boom
    sfxMenu: true,            // Menu click/select
    coop: false,
    lobbyPrivate: false,
    lobbyPassword: '',     // optional
    snip3Hud: true,
    seedStr: '',          // empty = auto
    seedOverlay: true,    // show seed briefly at run start
    debugOnMenu: true,    // show debug panel while in menus
    debugHudVisible: true,   // NEW: Current HUD visibility state
  };
  // Back-compat alias (some subsystems reference SETTINGS)
  const SETTINGS = settings;
  window.SETTINGS = SETTINGS;



  const prev = STORE.get(LS_LATEST);
  if (prev) STORE.set(LS_PREV, prev);
  STORE.remove(LS_LATEST);

  const start = performance.now();
  const runMeta = {
    startedISO: new Date().toISOString(),
    userAgent: navigator.userAgent,
    platform: navigator.platform,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    devicePixelRatio: window.devicePixelRatio || 1,
    version: 'proto-html-4p-1.1'
  };

  // ---------------------------
  // Seeded RNG (Minecraft-style)
  // One seed drives BOTH map + run deterministically.
  // ---------------------------
  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function() {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return h >>> 0;
    };
  }
  function mulberry32(a) {
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function normalizeSeed(s){
    s = (s == null) ? '' : String(s);
    s = s.trim();
    // Keep empty = auto
    return s;
  }
  function makeAutoSeed(){
    // Short, copyable; stable per start.
    const a = Date.now().toString(36);
    const b = Math.floor(Math.random()*1e9).toString(36);
    return (a + '-' + b).toUpperCase();
  }

  let currentSeed = '';
  let seedT0 = 0;
  let rand = () => Math.random();
  function setSeed(seedStr){
    currentSeed = normalizeSeed(seedStr);
    const use = currentSeed || makeAutoSeed();
    currentSeed = use;
    const h = xmur3(use);
    rand = mulberry32(h());
    seedT0 = performance.now();
    log('INFO', `SEED: ${currentSeed}`);
    return currentSeed;
  }
  function randRange(a,b){ return a + (b-a)*rand(); }
  function randSign(){ return rand() < 0.5 ? -1 : 1; }


  STORE.set(LS_META, JSON.stringify(runMeta));

  const logLines = [];
  const logEl = document.getElementById('log');
  let logVisible = true;

  function log(level, msg){
    const t = Math.floor(performance.now() - start);
    const line = `[+${String(t).padStart(6,'0')}ms] ${level}: ${msg}`;
    logLines.push(line);
    if (logLines.length > 600) logLines.shift();
    STORE.set(LS_LATEST, logLines.join('\n'));
    if (logVisible) {
      logEl.textContent = logLines.slice(-120).join('\n');
      logEl.scrollTop = logEl.scrollHeight;
    }
  }

  function logBanner(){
    log('INFO', '==== NEO-VECTR (HTML) ====');
    log('INFO', `Build: ${runMeta.version}`);
    log('INFO', `Platform: ${runMeta.platform}`);
    log('INFO', `TZ: ${runMeta.timezone}`);
    log('INFO', `DPR: ${runMeta.devicePixelRatio}`);
    log('INFO', `Logs: latest (this run) + previous (last run) via ${STORE.ok ? 'localStorage' : 'memory (storage blocked)'}`);
    log('INFO', `Storage: ${STORE.ok ? 'localStorage' : 'memory-only'}`);
    log('INFO', '===============================');
  }
  logBanner();

  function saveSettings(){
    try { STORE.set(LS_SETTINGS, JSON.stringify(settings)); } catch {}
  }
  function loadSettings(){
    try {
      const raw = STORE.get(LS_SETTINGS);
      if (!raw) return;
      const obj = JSON.parse(raw);
      if (!obj || typeof obj !== 'object') return;
      // Merge known keys only (forward-safe).
      for (const k of Object.keys(settings)) {
        if (k in obj) settings[k] = obj[k];
      }
    } catch {}
  }


  document.getElementById('dlLog').addEventListener('click', () => {
    let meta = {};
    try { meta = JSON.parse(STORE.get(LS_META) || '{}'); } catch { meta = {}; }
    const latest = STORE.get(LS_LATEST) || '';
    const blob = new Blob([JSON.stringify(meta,null,2) + '\n\n' + latest], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `NEO-VECTR_latest_${(meta.startedISO||'run').replace(/[:.]/g,'-')}.log.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  document.getElementById('showPrev').addEventListener('click', () => {
    const p = STORE.get(LS_PREV);
    if (!p) { log('WARN', 'No previous log found yet (run twice).'); return; }
    const blob = new Blob([p], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'NEO-VECTR_previous.log.txt';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  document.getElementById('clearLogs').addEventListener('click', () => {
    STORE.remove(LS_LATEST);
    STORE.remove(LS_PREV);
    STORE.remove(LS_META);
    logLines.length = 0;
    logBanner();

    log('INFO', 'Cleared logs.');
  });

  window.addEventListener('keydown', (e) => {
  // CAPSLOCK + SHIFT+TAB toggles debug HUD (hidden by default during gameplay).
  if (e.code === 'Tab' && e.shiftKey && e.getModifierState && e.getModifierState('CapsLock')) {
    setDebugVisible(!debugVisible);
    settings.debugOnMenu = debugVisible;
    saveSettings();
    e.preventDefault();
    return;
  }
    if (e.key === 'l' || e.key === 'L') {
      logVisible = !logVisible;
      logEl.style.display = logVisible ? 'block' : 'none';
      log('INFO', `Log visibility: ${logVisible ? 'ON' : 'OFF'}`);
    }
  });

  // ---------------------------
  // Canvas setup
  // ---------------------------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

  // ---------------------------
  // App modes: BOOT → MENU → GAME
  // ---------------------------
  let appMode = 'BOOT_WAIT'; // BOOT_WAIT, BOOT, MENU, GAME, PAUSE, VICTORY
  let bootT0 = 0;
  const BOOT_MIN_DURATION_MS = 5200;
  let bootFlash = 0;
  let menuSel = 0;
  let prevMenuSel = 0;
  let menuClickDown = false;
  let debugVisible = true;
  function setDebugVisible(v){
    debugVisible = !!v;
    const hud = document.getElementById('hud');
    if (hud) hud.style.display = debugVisible ? 'block' : 'none';
    settings.debugHudVisible = debugVisible;
    saveSettings(); // Persist state
    log('INFO', `Debug HUD: ${debugVisible ? 'VISIBLE' : 'HIDDEN'}`);
  }

  // Initialize persisted settings (must occur after settings + setDebugVisible exist)
  loadSettings();
  // Restore debug HUD visibility from saved state
  if (settings.hasOwnProperty('debugHudVisible')) {
    setDebugVisible(settings.debugHudVisible);
  } else {
    setDebugVisible(true); // Default: visible
  }
  // Auto-hide after boot completes unless user enables debugOnMenu
  let _bootAutoHideTimer = null;
  function scheduleBootAutoHide(){
    if(_bootAutoHideTimer) return;
    _bootAutoHideTimer = setTimeout(()=>{ try{ if(!settings.debugOnMenu) setDebugVisible(false); }catch(e){} }, 2500);
  }

  let menuDragKey = null;
  let prevMenuUp = false;
  let prevMenuDown = false;
  let prevMenuEnter = false;
  let prevMenuLeft = false;
  let prevMenuRight = false;
  let prevMenuEsc = false;
  let prevGpUp = false;
  let prevGpDown = false;
  let prevGpSelect = false;
  let prevGpLeft = false;
  let prevGpRight = false;
  let prevGpBack = false;

  // Pause overlay
  let pauseSel = 0;
  let pauseClickDown = false;
  let pauseEnterT0 = 0;

  // Game modes
  let gameMode = 'VS'; // VS, SNIP3

  // VS round state
  let winnerId = -1;
  let victoryTimer = 0;
  let victoryEnterT0 = 0;

  // Lobby overlay (Tab during gameplay)
  let lobbyOverlayVisible = false;
  let lobbyOverlayTimer = 0;
  const LOBBY_OVERLAY_DURATION = 3.0; // seconds

  // Menu animation timing
  let menuEnterT0 = performance.now();
  let menuPageEnterT0 = performance.now();

  function goMenu(){
    appMode = 'MENU';
    menuPage = 'MAIN';
    setDebugVisible(true);

    menuEnterT0 = performance.now();
    menuPageEnterT0 = menuEnterT0;
    // Keep selection consistent with the mode we were in.
    menuSel = (menuPage === 'MAIN' && gameMode === 'VS') ? 1 : 0;
    prevMenuSel = menuSel;

    // Ensure boot sound is not still playing.
    try { if (bootAudioEl) bootAudioEl.pause(); } catch {}

    // Start menu music once we arrive.
    startMenuMusic();
  }

  // Simulated ping for local players (realistic 20-80ms range)
  function getPlayerPing(playerId) {
    // In real online game, this would query actual network latency
    // For now, simulate based on player ID (deterministic)
    const basePing = 25;
    const variance = playerId * 7; // Slight variation per player
    return basePing + variance + Math.floor(Math.random() * 15);
  }

  function showLobbyOverlay(){
    if (appMode !== 'GAME') return; // Only in gameplay
    lobbyOverlayVisible = true;
    lobbyOverlayTimer = LOBBY_OVERLAY_DURATION;
    log('INFO', 'Lobby overlay: SHOWN');
  }

  function hideLobbyOverlay(){
    lobbyOverlayVisible = false;
    log('INFO', 'Lobby overlay: HIDDEN');
  }

  function updateLobbyOverlay(dt){
    if (!lobbyOverlayVisible) return;
    
    lobbyOverlayTimer -= dt;
    if (lobbyOverlayTimer <= 0) {
      hideLobbyOverlay();
    }
  }

  // ∞ SNIP3 label animation: blink ∞, scramble, settle
  function snip3MenuLabel(now){
    const t = (now - menuEnterT0) / 1000;
    const blinkDur = 0.65;
    const scrambleDur = 1.25;

    if (t < blinkDur) {
      const on = (Math.floor(t * 6) % 2) === 0;
      return on ? '∞' : '';
    }

    const tt = t - blinkDur;
    if (tt < scrambleDur) {
      const prog = tt / scrambleDur;
      const target = '∞ SNIP3';
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      // progressively lock characters from left → right
      const lockCount = Math.floor(target.length * Math.min(1, prog * 1.10));
      let out = '';
      for (let i = 0; i < target.length; i++) {
        const ch = target[i];
        if (i < lockCount || ch === ' ' || ch === '∞') {
          out += ch;
        } else {
          // deterministic-ish jitter by time + index
          const k = (Math.floor(tt * 30) + i * 17) % chars.length;
          out += chars[k];
        }
      }
      return out;
    }

    return '∞ SNIP3';
  }

  let qualityPreset = 2; // 1=low,2=default,3=high
  function presetToInternalScale(p){
    if (p === 1) return 0.75;
    if (p === 3) return 1.25;
    return 1.0;
  }

  function resize(){
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const scale = presetToInternalScale(qualityPreset);

    const targetW = Math.floor(window.innerWidth * dpr * scale);
    const targetH = Math.floor(window.innerHeight * dpr * scale);

    canvas.width = Math.max(320, targetW);
    canvas.height = Math.max(180, targetH);

    canvas.style.width = '100vw';
    canvas.style.height = '100vh';

    log('INFO', `Resize: ${window.innerWidth}x${window.innerHeight} css, fb=${canvas.width}x${canvas.height}, preset=${qualityPreset}`);
  }

  window.addEventListener('resize', resize);
  resize();

  window.addEventListener('keydown', (e) => {
    if (e.key === '1') { qualityPreset = 1; resize(); }
    if (e.key === '2') { qualityPreset = 2; resize(); }
    if (e.key === '3') { qualityPreset = 3; resize(); }
  });

  // ---------------------------
  // Math helpers
  // ---------------------------
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const len = (x,y) => Math.hypot(x,y);
  const norm = (x,y) => {
    const l = Math.hypot(x,y);
    if (l < 1e-6) return {x:0,y:0,l:0};
    return {x:x/l,y:y/l,l:l};
  };
  const TAU = Math.PI * 2;
  function ang01(rad){
    let a = rad % TAU;
    if (a < 0) a += TAU;
    return a;
  }


  // ---------------------------
  // Neon tube lettering (NO FONTS)
  // ---------------------------
  // Tube glyphs are defined as polylines in a unit box (0..1).
  // This keeps the look consistent with player neon geometry.

  function _polyCircle(cx, cy, r, steps=14, start=0){
    const pts = [];
    for (let i=0;i<=steps;i++){
      const a = start + (i/steps) * TAU;
      pts.push([cx + Math.cos(a)*r, cy + Math.sin(a)*r]);
    }
    return pts;
  }

  const TUBE_GLYPHS = {
    ' ': [],
    '-': [ [[0.15,0.55],[0.85,0.55]] ],
    'I': [ [[0.50,0.12],[0.50,0.88]], [[0.30,0.12],[0.70,0.12]], [[0.30,0.88],[0.70,0.88]] ],
    'N': [ [[0.18,0.88],[0.18,0.12]], [[0.18,0.88],[0.82,0.12]], [[0.82,0.12],[0.82,0.88]] ],
    'E': [ [[0.82,0.12],[0.18,0.12]], [[0.18,0.12],[0.18,0.88]], [[0.18,0.50],[0.70,0.50]], [[0.18,0.88],[0.82,0.88]] ],
    'O': [ _polyCircle(0.5,0.5,0.38,18) ],

  function drawTubePolyline(pts, x, y, s, color, power=1.0, innerColor=null){
    if (!pts || pts.length < 2) return;
    const now = performance.now()*0.001;
    const wob = (Math.sin(now*3.0 + (x+y)*0.001) * 0.002);

    // Stronger neon "breathing" + near-off flicker (Geometry-Wars-ish signage feel)
    const pulse = 0.55 + 0.45*Math.sin(now*2.25 + (x+y)*0.004);
    const flick = 0.70 + 0.30*Math.sin(now*13.0 + (x+y)*0.020) + 0.18*Math.sin(now*29.0 + (x+y)*0.055);
    const rareDip = (Math.sin(now*7.7 + (x+y)*0.012) > 0.93) ? 0.22 : 1.0;

    const dyn = clamp((0.10 + 0.90*pulse) * flick, 0.12, 1.20) * rareDip;
    const pwr = clamp(power * dyn, 0.08, 1.25);

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Outer tube glow (purple shell)
    ctx.globalCompositeOperation = 'lighter';
    for (let i=0;i<4;i++){
      const a = (0.05 + 0.04*i) * pwr;
      ctx.strokeStyle = color.replace('ALPHA', String(a));
      ctx.lineWidth = (0.12 + i*0.16);
      ctx.beginPath();
      for (let j=0;j<pts.length;j++){
        const px = pts[j][0] + wob;
        const py = pts[j][1] + wob;
        if (j==0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }

    // Inner neon core (opaque-ish colored center) — this is what makes letters feel "filled"
    const core = innerColor || `rgba(255,255,255,ALPHA)`;
    ctx.globalCompositeOperation = 'lighter';

    // Fat inner pass (color body)
    ctx.strokeStyle = core.replace('ALPHA', String(0.18 + 0.82*pwr));
    ctx.lineWidth = 0.14;
    ctx.beginPath();
    for (let j=0;j<pts.length;j++){
      const px = pts[j][0] + wob;
      const py = pts[j][1] + wob;
      if (j==0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Hot center filament (tight bright line)
    ctx.strokeStyle = `rgba(255,255,255,${0.20 + 0.80*pwr})`;
    ctx.lineWidth = 0.07;
    ctx.beginPath();
    for (let j=0;j<pts.length;j++){
      const px = pts[j][0] + wob;
      const py = pts[j][1] + wob;
      if (j==0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();

    ctx.restore();
  }



  // Neon palette for multicolor inner tubes (inside the purple shell)
  const TITLE_INNER_PALETTE = [
    'rgba(0,255,255,ALPHA)',   // cyan
    'rgba(255,220,0,ALPHA)',   // neon yellow
    'rgba(0,255,140,ALPHA)',   // neon green
    'rgba(255,80,220,ALPHA)',  // pink

  function drawTubeText(text, cx, cy, heightPx, colorRGBA='rgba(175,75,255,ALPHA)', power=1.0, letterSpace=0.22, innerPalette=null){
    const s = heightPx;
    const chars = String(text).toUpperCase().split('');
    const sum = (arr)=>arr.reduce((a,b)=>a+b,0);
    const widths = chars.map(ch => (ch === ' ' ? 0.55 : 1.0));
    const totalUnits = sum(widths) + letterSpace*(chars.length-1);
    const totalPx = totalUnits * s;
    let x = cx - totalPx/2;
    const y = cy - s/2;

    // For multicolor fills we only advance the palette on visible glyphs
    let colorStep = 0;

    for (let i=0;i<chars.length;i++){
      const ch = chars[i];
      const polys = TUBE_GLYPHS[ch] || TUBE_GLYPHS[' '];
      const w = widths[i] * s;

      let inner = null;
      if (innerPalette && ch !== ' ') {
        inner = innerPalette[colorStep % innerPalette.length];
        colorStep++;
      }

      for (const poly of polys){
        drawTubePolyline(poly, x, y, s, colorRGBA, power, inner);
      }
      x += w + letterSpace*s;
    }
  }

  function arena(){

  }


  function fbFromClient(clientX, clientY){
    const r = canvas.getBoundingClientRect();
    const nx = (clientX - r.left) / (r.width || 1);
    const ny = (clientY - r.top) / (r.height || 1);
    return {
      x: nx * canvas.width,
      y: ny * canvas.height
    };
  }


  function clamp01(x){ return Math.max(0, Math.min(1, x)); }

  function applyBrightnessPass(){
    // Lightweight global brightness (post-pass). Avoids touching all draw calls.
    const b = Math.max(-0.30, Math.min(0.30, settings.brightness || 0));
    if (Math.abs(b) < 0.001) return;
    ctx.globalCompositeOperation = 'source-over';
    const a = Math.min(0.35, Math.abs(b));
    ctx.fillStyle = (b < 0) ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a})`;
    ctx.fillRect(0,0,canvas.width, canvas.height);
  }

  const players = [];

  // One interior barrier per slice (kept lightweight + deterministic)
  // Barriers are simple chord segments inside each slice so the arena always has
  // at least one interesting ricochet / line-of-sight break per player.
  const barriers = [];

  function initBarriers(){
    barriers.length = 0;
    const a = arena();

    // Seeded barrier profile (depends on currentSeed + playerCount)
    // Keep lightweight: one chord per slice.
    const baseR = a.r * randRange(0.52, 0.62);
    const rot = randRange(0, TAU); // rotation inside the slice
    for (let i=0;i<playerCount;i++){
      const angMin = (TAU * i) / playerCount;
      const angMax = (TAU * (i+1)) / playerCount;
      const mid = (angMin + angMax) * 0.5 + (rot * 0.06 * randSign());
      const span = (angMax - angMin);

      const delta = span * randRange(0.16, 0.28);
      const r = baseR * randRange(0.92, 1.06);

      const a0 = mid - delta;
      const a1 = mid + delta;
      const x0 = a.cx + Math.cos(a0)*r;
      const y0 = a.cy + Math.sin(a0)*r;
      const x1 = a.cx + Math.cos(a1)*r;
      const y1 = a.cy + Math.sin(a1)*r;

      // store center distance for spawn safety
      barriers.push({ slice:i, x0,y0,x1,y1, r });
    }
  }

  function initPlayers(){
    players.length = 0;

    // Deterministic spawn planner:
    // - stays inside each slice with angular margins
    // - spawns OUTSIDE the interior barrier (so players don't insta-kill)
    // - enforces minimum separation; falls back to evenly spaced if needed
    const a = arena;
    const sliceA0 = -Math.PI/2;
    const sliceW  = TAU / Math.max(1, playerCount);

    const minSep = a.r * 0.16;          // tuned for 8-way melee without overlap
    const angMargin = Math.min(sliceW * 0.18, 0.30); // keep away from slice borders
    const rMin = a.r * 0.54;
    const rMax = a.r * 0.80;

    function barrierMidRFor(i){
      if (!barriers || !barriers[i]) return a.r*0.38;
      const b = barriers[i];
      const mx = (b.ax + b.bx) * 0.5;
      const my = (b.ay + b.by) * 0.5;
      return Math.hypot(mx, my);
    }

    function trySpawn(i, attempts){
      const baseAngMin = sliceA0 + i*sliceW + angMargin;
      const baseAngMax = sliceA0 + (i+1)*sliceW - angMargin;

      // push spawns outside the barrier for this slice
      const bMidR = barrierMidRFor(i);
      const spawnRMin = clamp(bMidR + a.r*0.14, rMin, rMax);

      for (let k=0;k<attempts;k++){
        const ang = randRange(baseAngMin, baseAngMax);
        // slightly vary radius but keep outside barrier
        const rr  = randRange(spawnRMin, rMax);
        const x = Math.cos(ang)*rr;
        const y = Math.sin(ang)*rr;

        // keep away from center line (helps "spawn behind barrier" feeling)
        if (rr < spawnRMin) continue;

        // separation check
        let ok = true;
        for (let p=0;p<players.length;p++){
          const dx = x - players[p].x;
          const dy = y - players[p].y;
          if (dx*dx + dy*dy < minSep*minSep){ ok=false; break; }
        }
        if (ok) return {x,y,ang,rr};
      }
      return null;
    }

    for (let i=0;i<playerCount;i++){
      const mid = sliceA0 + (i+0.5)*sliceW;

      // attempt a "smart" spawn first, then degrade gracefully
      const s = trySpawn(i, 28) || trySpawn(i, 8) || {x:Math.cos(mid)*a.r*0.66, y:Math.sin(mid)*a.r*0.66, ang:mid, rr:a.r*0.66};

      // tiny seeded jitter (keeps it from looking stamped, but still deterministic)
      const jA = randRange(-sliceW*0.03, sliceW*0.03);
      const jR = randRange(-a.r*0.008, a.r*0.008);
      const ang = s.ang + jA;
      const rr  = clamp(s.rr + jR, rMin, rMax);
      const x = Math.cos(ang)*rr;
      const y = Math.sin(ang)*rr;

      const col = COLORS[i % COLORS.length];

      players.push({
        id: i+1,
        name: `P${i+1}`,
        color: col,
        x, y,
        vx: 0, vy: 0,
        ang,
        alive: true,
        score: 0,
        lives: 3,
        cooldown: 0,
        charge: 0,
        boost: 0,
        lastMoveX: Math.cos(ang),
        lastMoveY: Math.sin(ang),
      });
    }

    log('INFO', `Initialized ${playerCount} player(s) + slices. Seed=${SETTINGS.seedStr}`);
  }

  // ---------------------------

  function neonLine(x0,y0,x1,y1, coreW, haloW, coreA, haloA, color){
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(${color.r},${color.g},${color.b},${haloA})`;
    ctx.lineWidth = haloW;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();

    ctx.strokeStyle = `rgba(${color.r},${color.g},${color.b},${coreA})`;
    ctx.lineWidth = coreW;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  }

  function neonPoly(points, coreW, haloW, coreA, haloA, color){
    for (let i=0;i<points.length;i++){
      const a = points[i];
      const b = points[(i+1)%points.length];
      neonLine(a.x,a.y,b.x,b.y, coreW, haloW, coreA, haloA, color);
    }
  }

  function drawArenaRing(){
    const a = arena();

    ctx.globalCompositeOperation = 'lighter';

    ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${0.06})`;
    ctx.lineWidth = 10;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(a.cx,a.cy,a.r,0,Math.PI*2);
    ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},${0.14})`;
    ctx.lineWidth = 2.2;
    ctx.stroke();
  }

  function drawPlayerSlices(){
    const a = arena();

    // soft fill wedges (subtle)
    for (const p of players){
      const j = (p.id === 0) ? sliceShakeAng : 0;
      const a0 = p.angMin + j;
      const a1 = p.angMax + j;
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      ctx.moveTo(a.cx, a.cy);
      ctx.arc(a.cx, a.cy, a.r * 0.985, a0, a1);
      ctx.closePath();
      ctx.fillStyle = `rgba(${p.color.r},${p.color.g},${p.color.b},0.028)`;
      ctx.fill();
    }

    // wedge boundary lines
    for (const p of players){
      const j = (p.id === 0) ? sliceShakeAng : 0;
      const a0 = p.angMin + j;
      const c = p.color;
      const x0 = a.cx + Math.cos(a0)*a.r;
      const y0 = a.cy + Math.sin(a0)*a.r;
      neonLine(a.cx,a.cy, x0,y0, 1.3, 7.0, 0.22, 0.06, c);
    }

    // outer slice arcs (color-coded)
    for (const p of players){
      const j = (p.id === 0) ? sliceShakeAng : 0;
      const a0 = p.angMin + j;
      const a1 = p.angMax + j;
      const c = p.color;
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();

      ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b},0.14)`;

  function drawBarriers(){
    if (!barriers.length) return;

  function drawPlayerTrail(p){

  // Robust play helper: retries + state tracking so critical sounds can't silently fail.
  function playWithRetry(el, label, opts){
    // Bullet-proof play helper:
    // - Never spams autoplay-rejected attempts
    // - Leaves a clear log + status state
    // - Retries only when it *can* succeed (after user gesture unlock)
    const tag = `[${label}]`;
    const maxAttempts = Math.max(1, (opts && opts.maxAttempts) || 3);
    const delayMs = (opts && opts.delayMs) || 180;
    const dbg = (opts && opts.dbg) || null;

    if (!el) {
      log('WARN', `${tag} missing element`);
      if (dbg){ dbg.state='error'; dbg.err='missing element'; }
      return { ok:false, reason:'missing' };
    }

    // Queue this play request if we don't have an unlocked audio context yet.
    // We will drain the queue after the first user gesture.
    if (!_audioUnlocked) {
      if (dbg){ dbg.state='blocked'; dbg.err='awaiting user gesture'; }
      log('WARN', `${tag} awaiting user gesture to enable audio`);
      _pendingPlays.push(() => playWithRetry(el, label, opts));
      return { ok:false, reason:'needs_gesture' };
    }

    let attempt = 0;
    let done = false;

    const tryOnce = () => {
      if (done) return;
      attempt += 1;
      try {
        const p = el.play();
        if (p && typeof p.then === 'function') {
          p.then(() => {
            done = true;
            if (dbg){ dbg.state='playing'; dbg.err=''; }
            log('INFO', `${tag} playing`);
          }).catch((err) => {
            const msg = String(err && (err.name || err.message) || err);
            if (dbg){ dbg.state='error'; dbg.err=msg.slice(0,140); }

            // If autoplay is still blocked somehow, don't spin retries.
            if (String(msg).includes('NotAllowedError')) {
              log('WARN', `${tag} play blocked (gesture required): ${msg}`);
              _pendingPlays.push(() => playWithRetry(el, label, opts));
              return;
            }

            if (attempt < maxAttempts) {
              setTimeout(tryOnce, delayMs);
            } else {
              log('WARN', `${tag} play failed after ${attempt} attempts: ${msg}`);
            }
          });
        } else {
          // Some browsers return void.
          done = true;
          if (dbg){ dbg.state='playing'; dbg.err=''; }
          log('INFO', `${tag} playing (void promise)`);
        }
      } catch (e) {
        const msg = String(e && (e.name || e.message) || e);
        if (dbg){ dbg.state='error'; dbg.err=msg.slice(0,140); }
        if (String(msg).includes('NotAllowedError')) {
          log('WARN', `${tag} play blocked (gesture required): ${msg}`);
          _pendingPlays.push(() => playWithRetry(el, label, opts));
          return;
        }
        if (attempt < maxAttempts) setTimeout(tryOnce, delayMs);
      }
    };

    // If it isn't ready yet, canplay will often fix first-play ordering.
    const onCanPlay = () => {
      el.removeEventListener('canplay', onCanPlay);
      if (el.paused && !done && attempt < maxAttempts) setTimeout(tryOnce, 0);
    };
    el.addEventListener('canplay', onCanPlay);

    tryOnce();
    return { ok:true, reason:'attempted' };
  }

  function startBoot(){
    if (appMode !== 'BOOT_WAIT') return;
    appMode = 'BOOT';
    bootT0 = performance.now();
    bootFlash = 0;

    try {
      if (!bootAudioEl) {
        bootAudioEl = new Audio(BOOT_SOUND_SRC);
        bootAudioEl.preload = 'auto';
        bootAudioEl.loop = false;
        bootAudioEl.volume = Math.max(0, Math.min(1, settings.sfxVol ?? 0.85));
        audioDbg.boot.src = BOOT_SOUND_SRC;
        wireAudioDebug(bootAudioEl, 'boot');
      }

      // Always play boot sound directly from the media element.
      // (WebAudio routing can be silent if an AudioContext is suspended.)
      try { bootAudioEl.pause(); } catch {}
      try { bootAudioEl.currentTime = 0; } catch {}
      playWithRetry(bootAudioEl, 'boot', { attempts: 10, delayMs: 120, tag: 'MOSES_BOOT' });

      // If it ends, go to menu.
      bootAudioEl.onended = () => {
        // Don't snap out instantly; keep the power-up on-screen long enough to read.
        const dt = performance.now() - bootT0;
        if (appMode === 'BOOT' && dt >= BOOT_MIN_DURATION_MS) goMenu();
        else if (appMode === 'BOOT') setTimeout(()=>{ if(appMode==='BOOT') goMenu(); }, Math.max(0, BOOT_MIN_DURATION_MS - dt));
      };

      // Fail-safe: if something weird happens (metadata never loads, etc), still progress.
      // IMPORTANT: do not cut the boot sound short. Prefer duration-based timing.
      let fallbackMs = Math.max(20000, BOOT_MIN_DURATION_MS + 2000);
      let bootFailSafeTid = 0;
      const armFailSafe = () => {
        // If duration is known, wait for it (plus a small buffer).
        const dur = Number(bootAudioEl.duration);
        if (isFinite(dur) && dur > 0) {
          fallbackMs = Math.max(fallbackMs, Math.round(dur * 1000) + 750);
        }
        if (bootFailSafeTid) clearTimeout(bootFailSafeTid);
        bootFailSafeTid = setTimeout(() => { if (appMode === 'BOOT') goMenu(); }, fallbackMs);
      };
      // If metadata arrives, arm a better fail-safe; otherwise arm immediately with a generous max.
      bootAudioEl.onloadedmetadata = () => { try { armFailSafe(); } catch {} };
      try { armFailSafe(); } catch {}
    } catch (e) {
      setTimeout(() => { if (appMode === 'BOOT') goMenu(); }, 1800);
    }
  }

  function drawPlayerShip(p, isP1){

    const ang = Math.atan2(p.aimY, p.aimX);
    const fX = Math.cos(ang), fY = Math.sin(ang);
    const rX = -fY, rY = fX;

    const s = 18;
    const tip   = {x: sx + fX * (2.2*s), y: sy + fY*(2.2*s)};
    const left  = {x: sx + fX * (-1.0*s) + rX*(0.9*s), y: sy + fY*(-1.0*s) + rY*(0.9*s)};
    const right = {x: sx + fX * (-1.0*s) - rX*(0.9*s), y: sy + fY*(-1.0*s) - rY*(0.9*s)};

    neonPoly(
      [tip,left,right],
      2.2,
      10.0,
      0.90,
      0.18,
      p.color
    );

    // P1 boost jets (blue)
    if (isP1 && boostFx > 0) {
      const t = clamp(boostFx / BOOST_FX_TIME, 0, 1); // 1 -> fresh dash, 0 -> gone
      const sE = t*t*(3-2*t); // smoothstep
      const jetCol = {r:80,g:180,b:255};
      const backX = -fX, backY = -fY;

      // Start long/bright, ease out smoothly (no harsh pop).
      const jetLen = 12 + 38*sE;
      const coreA = 0.95 * sE;
      const haloA = 0.26 * sE;

      neonLine(left.x, left.y, left.x + backX*jetLen, left.y + backY*jetLen, 2.4, 18.0, coreA, haloA, jetCol);
      neonLine(right.x, right.y, right.x + backX*jetLen, right.y + backY*jetLen, 2.4, 18.0, coreA, haloA, jetCol);

      // Soft after-streak behind the ship for “buttery” boost feedback.
      neonLine(sx - fX*8, sy - fY*8, sx + backX*(22+18*sE), sy + backY*(22+18*sE), 1.4, 22.0, 0.22*sE, 0.10*sE, jetCol);
    }

    // Aim feeler
    neonLine(sx,sy, sx+p.aimX*40, sy+p.aimY*40, 1.2, 6.0, 0.35, 0.06, {r:255,g:180,b:255});

    // P1 charge aura
    if (isP1 && charge > 0.01) {
      const a = 0.06 + 0.10*charge;
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      ctx.arc(sx, sy, 18 + 18*charge, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(255,240,80,${a})`;
      ctx.lineWidth = 6 + 14*charge;
      ctx.stroke();
    }

    // P1 boost-charge aura
    if (isP1 && boostCharging && boostCharge > 0.02) {
      const a = 0.05 + 0.085*boostCharge;
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      ctx.arc(sx, sy, 22 + 22*boostCharge, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(80,180,255,${a})`;
      ctx.lineWidth = 6 + 12*boostCharge;
      ctx.stroke();
    }

    // P1 boost cooldown flash
    if (isP1 && boostCooldown > 0) {
      const prog = 1 - clamp(boostCooldown / BOOST_COOLDOWN, 0, 1);
      const pulse = 0.5 + 0.5 * Math.sin(tSec * (10 + 14*prog));
      const flashA = (0.05 + 0.10 * pulse) * (0.35 + 0.65*prog);
      const flashCol = {r:80,g:180,b:255};
      neonPoly([tip,left,right], 2.0, 9.0, flashA*1.1, flashA*0.30, flashCol);
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      ctx.arc(sx, sy, 18 + 10*pulse, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(80,180,255,${flashA})`;
      ctx.lineWidth = 3.0;
      ctx.stroke();
    }
  }

  function drawTouchSticks(){
    if (!(touchMove.active || touchAim.active)) return;
    const drawStick = (stick, col) => {
      if (!stick.active) return;
      const dx = stick.x - stick.startX;
      const dy = stick.y - stick.startY;
      const maxR = 60;
      const l = len(dx,dy);
      const ux = l > 1e-6 ? dx/l : 0;
      const uy = l > 1e-6 ? dy/l : 0;
      const ex = stick.startX + ux*Math.min(l, maxR);
      const ey = stick.startY + uy*Math.min(l, maxR);

      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath(); ctx.arc(stick.startX, stick.startY, maxR, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(${col.r},${col.g},${col.b},0.10)`; ctx.lineWidth = 8; ctx.stroke();
      ctx.beginPath(); ctx.arc(stick.startX, stick.startY, maxR, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(${col.r},${col.g},${col.b},0.22)`; ctx.lineWidth = 2; ctx.stroke();

      ctx.beginPath(); ctx.arc(ex, ey, 18, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(${col.r},${col.g},${col.b},0.25)`; ctx.lineWidth = 10; ctx.stroke();
      ctx.beginPath(); ctx.arc(ex, ey, 18, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(${col.r},${col.g},${col.b},0.65)`; ctx.lineWidth = 2.5; ctx.stroke();
    };

    drawStick(touchMove, {r:120,g:255,b:255});
    drawStick(touchAim,  {r:255,g:90,b:230});
  }

  // ---------------------------
  // Ricochet helpers
  // ---------------------------
  function intersectSegmentCircle(p0x,p0y,p1x,p1y,cx,cy,r){
    const dx = p1x - p0x;
    const dy = p1y - p0y;
    const fx = p0x - cx;
    const fy = p0y - cy;

    const a = dx*dx + dy*dy;
    const b = 2*(fx*dx + fy*dy);
    const c = fx*fx + fy*fy - r*r;

    const disc = b*b - 4*a*c;
    if (disc < 0 || a < 1e-9) return null;

    const t = (-b - Math.sqrt(disc)) / (2*a);
    if (t >= 0 && t <= 1) return t;
    return null;
  }

  function closestPointOnSeg(px,py, x0,y0,x1,y1){
    const dx = x1 - x0;
    const dy = y1 - y0;
    const len2 = dx*dx + dy*dy;
    if (len2 < 1e-9) return {x:x0,y:y0,t:0};
    let t = ((px - x0)*dx + (py - y0)*dy) / len2;
    t = clamp(t, 0, 1);
    return {x: x0 + dx*t, y: y0 + dy*t, t};
  }

  function segmentsIntersect(ax,ay,bx,by, cx,cy,dx,dy){
    // Returns t along AB (0..1) for intersection, or null.
    const rX = bx-ax, rY = by-ay;
    const sX = dx-cx, sY = dy-cy;
    const denom = rX*sY - rY*sX;
    if (Math.abs(denom) < 1e-9) return null;
    const u = ((cx-ax)*rY - (cy-ay)*rX) / denom;
    const t = ((cx-ax)*sY - (cy-ay)*sX) / denom;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) return t;
    return null;
  }

  function reflectVelocity(vx,vy, nx,ny, damp=0.92){
    // Reflect v across unit normal
    const vn = vx*nx + vy*ny;
    return {
      vx: (vx - 2*vn*nx) * damp,
      vy: (vy - 2*vn*ny) * damp,
    };
  }

  // ---------------------------
  // Movement + slice constraint
  // ---------------------------
  function wrapToPi(a){
    // Map angle to (-pi, pi]
    a = (a + Math.PI) % TAU;
    if (a < 0) a += TAU;
    return a - Math.PI;
  }

  function constrainToSlice(p){
    const a = arena();
    const dx = p.x - a.cx;
    const dy = p.y - a.cy;
    let r = Math.hypot(dx,dy);
    if (r < 1e-6) r = 1e-6;

    // --- Anti-teleport seam h&&ling ---
    // Use an angle representation that is *closest to the slice center* before clamping.
    const center = (p.angMin + p.angMax) * 0.5;
    const raw = Math.atan2(dy,dx);
    let ang = center + wrapToPi(raw - center);

    // Clamp angle into this slice.
    if (ang < p.angMin) ang = p.angMin;
    if (ang > p.angMax) ang = p.angMax;

    // Hard clamp radius inside arena.
    const maxR = a.r;
    const minR = 10;
    r = clamp(r, minR, maxR);

    p.x = a.cx + Math.cos(ang)*r;
    p.y = a.cy + Math.sin(ang)*r;

    // Surface normal at this (r,ang)
    const nx = Math.cos(ang), ny = Math.sin(ang);
    const vn = p.vx*nx + p.vy*ny;

    // Outer ring collision: kill only outward velocity so it *slides*.
    if (r >= maxR - 0.5 && vn > 0) {
      p.vx -= nx * vn;
      p.vy -= ny * vn;
    }

    // Slice seam collision: damp the tangential component when sitting on a seam.
    // (Prevents jitter && 'edge surfing' while preserving slide.)
    const tx = -ny, ty = nx;
    const vt = p.vx*tx + p.vy*ty;
    const seamEps = 0.0006;
    const onMin = Math.abs(ang - p.angMin) < seamEps;
    const onMax = Math.abs(ang - p.angMax) < seamEps;
    if (onMin || onMax) {
      p.vx -= tx * vt * 0.45;
      p.vy -= ty * vt * 0.45;
    }
  }

  function collidePlayerWithBarrier(p){
    if (!barriers.length) return;
    const PR = 18;
    for (const B of barriers){
      if (B.slice !== p.id) continue; // barrier belongs to player's slice
      const cp = closestPointOnSeg(p.x,p.y, B.x0,B.y0,B.x1,B.y1);
      const dx = p.x - cp.x;
      const dy = p.y - cp.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < PR*PR){
        const d = Math.sqrt(d2) || 1;
        const nx = dx / d;
        const ny = dy / d;
        // Push out
        const push = (PR - d) + 0.6;
        p.x += nx * push;
        p.y += ny * push;
        // Reflect only if moving into barrier
        const vn = p.vx*nx + p.vy*ny;
        if (vn < 0) {
          p.vx -= nx * vn * 1.85;
          p.vy -= ny * vn * 1.85;
          p.vx *= 0.92;
          p.vy *= 0.92;
        }
      }
    }
  }

  // ---------------------------
  // Sampling inputs
  // ---------------------------
  function sampleP1(){
    // Movement
    let mx = 0, my = 0;
    if (keys.has('KeyW')) my -= 1;
    if (keys.has('KeyS')) my += 1;
    if (keys.has('KeyA')) mx -= 1;
    if (keys.has('KeyD')) mx += 1;

    if (touchMove.active) {
      const dx = touchMove.x - touchMove.startX;
      const dy = touchMove.y - touchMove.startY;
      const n = norm(dx,dy);
      const mag = clamp(n.l / 60, 0, 1);
      mx += n.x * mag;
      my += n.y * mag;
    }

    // Also allow gamepad 0 to move P1 (optional) — SNIP3 only.
    // In VS, keyboard/mouse is the "computer" player; pads should never double-control P1.
    const gpList = getConnectedGamepads();
    const gp0 = gpList.find(g => g.index === 0)?.pad || null;
    if (gp0 && gameMode === 'SNIP3') {
      const lx = gp0.axes[0] || 0;
      const ly = gp0.axes[1] || 0;
      const dz = 0.18;
      const l = len(lx,ly);
      if (l > dz) {
        const k = (l - dz) / (1 - dz);
        mx += (lx / l) * k;
        my += (ly / l) * k;
      }
    }

    const m = norm(mx,my);
    const move = (m.l > 1e-6) ? {x:m.x, y:m.y, mag: clamp(m.l,0,1)} : {x:0,y:0,mag:0};

    // Aim
    let ax = 0, ay = 0;
    if (aimMode === 'arrows') {
      ax = Math.cos(aimAngle);
      ay = Math.sin(aimAngle);
    } else {
      const p1 = players[0];
      const fb = fbFromClient(mouseX, mouseY);
      const fbX = fb.x;
      const fbY = fb.y;
      const dx = fbX - p1.x;
      const dy = fbY - p1.y;
      const n = norm(dx,dy);
      ax = n.x; ay = n.y;
    }

    if (touchAim.active) {
      const dx = touchAim.x - touchAim.startX;
      const dy = touchAim.y - touchAim.startY;
      const n = norm(dx,dy);
      const mag = clamp(n.l / 40, 0, 1);
      if (mag > 0.25) { ax = n.x; ay = n.y; }
    }

    if (gp0) {
      const rx = gp0.axes[2] || 0;
      const ry = gp0.axes[3] || 0;
      const dz = 0.22;
      const l = len(rx,ry);
      if (l > dz) {
        ax = rx / l;
        ay = ry / l;
      }
    }

    const a = norm(ax,ay);
    const aimActive = (a.l > 0.15);

    const gpFire = gp0 && gp0.buttons && gp0.buttons[7] && gp0.buttons[7].pressed;

    return { move, aim: {x:a.x,y:a.y,active:aimActive}, gpFire: !!gpFire };
  }

  function eliminatePlayer(pid, hx, hy){
    const p = players[pid];

  function sampleGamepadForPlayer(playerIndex, padIndex){
    const p = players[playerIndex];
    const pads = getConnectedGamepads();
    const gp = pads.find(g => g.index === padIndex)?.pad || null;
    if (!gp) return null;

    // Left stick move
    const lx = gp.axes[0] || 0;
    const ly = gp.axes[1] || 0;
    const dz = 0.22;
    let mx = 0, my = 0;
    const l = len(lx,ly);
    if (l > dz) {
      const k = (l - dz) / (1 - dz);
      mx = (lx / l) * k;
      my = (ly / l) * k;
    }

    // Right stick aim
    const rx = gp.axes[2] || 0;
    const ry = gp.axes[3] || 0;
    let ax = 0, ay = 0;
    const rl = len(rx,ry);
    if (rl > 0.24) {
      ax = rx / rl;
      ay = ry / rl;
    } else {
      ax = p.aimX;
      ay = p.aimY;
    }

    const moveN = norm(mx,my);
    const aimN  = norm(ax,ay);

    return {
      move: { x: moveN.x, y: moveN.y, mag: clamp(moveN.l,0,1) },
      aim:  { x: aimN.x,  y: aimN.y,  active: aimN.l > 0.15 }
    };
  }

  // ---------------------------
  // Init
  // ---------------------------
  // ---------------------------
  // Boot + Menu helpers
  // ---------------------------
  function smoothstep(a,b,t){
    t = clamp((t-a)/(b-a), 0, 1);
    return t*t*(3-2*t);
  }

  function computeBootEnergy(){
    // Prefer real audio energy if we have an analyser, otherwise use a lightweight
    // time-domain pulse so boot visuals still feel alive even if WebAudio is unavailable.
    if (bootAnalyser && bootFreq) {
      try {
        bootAnalyser.getByteFrequencyData(bootFreq);
        const n = Math.min(28, bootFreq.length);
        let sum = 0;
        for (let i=0;i<n;i++) sum += bootFreq[i];
        return (sum / n) / 255;
      } catch {}
    }

    if (bootAudioEl && !bootAudioEl.paused) {
      const tt = bootAudioEl.currentTime || 0;
      const pulse = 0.10 + 0.18*Math.abs(Math.sin(tt*6.5)) + 0.06*Math.abs(Math.sin(tt*13.0));
      return clamp(pulse, 0, 1);
    }
    return 0;
  }

  function drawBootScreen(now){
    const a = arena();
    const t = (now - bootT0) * 0.001;

    // Analyse audio
    const e = computeBootEnergy();
    bootEnergy = e;
    bootEnergySm = bootEnergySm * 0.90 + e * 0.10;
    const rise = e - bootEnergySm;
    if (bootBeatHold > 0) bootBeatHold -= 1/60;
    if (rise > 0.07 && bootBeatHold <= 0) {
      bootBeatHold = 0.12;
      bootFlash = 1.0;
    }
    bootFlash *= 0.90;

    // Backdrop
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,canvas.width, canvas.height);

    // Subtle vignette
    const grd = ctx.createRadialGradient(a.cx, a.cy, a.r*0.1, a.cx, a.cy, a.r*1.25);
    grd.addColorStop(0, 'rgba(40,0,55,0.35)');
    grd.addColorStop(1, 'rgba(0,0,0,0.95)');
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,canvas.width, canvas.height);

    // Spectrum + waveform
    if (bootAnalyser && bootFreq && bootTime) {
      bootAnalyser.getByteFrequencyData(bootFreq);
      bootAnalyser.getByteTimeDomainData(bootTime);

      const bottom = canvas.height * 0.86;
      const left = canvas.width * 0.14;
      const right = canvas.width * 0.86;
      const w = right - left;

      // Bars (visual spectrum)
      const bins = 72;
      for (let i=0;i<bins;i++) {
        const idx = Math.floor((i / bins) * Math.min(bootFreq.length, 512));
        const v = bootFreq[idx] / 255;
        const h = v * canvas.height * 0.16;
        const x = left + (i / bins) * w;
        const glow = 0.10 + 0.25*v + 0.35*bootFlash;
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `rgba(175,75,255,${glow})`;
        ctx.fillRect(x, bottom - h, Math.max(1, w/bins - 2), h);
      }

      // Waveform line
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(120,255,255,${0.10 + 0.25*bootFlash})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      const midY = canvas.height * 0.60;
      for (let i=0;i<bootTime.length;i++) {
        const x = left + (i/(bootTime.length-1))*w;
        const y = midY + ((bootTime[i]-128)/128) * canvas.height * 0.06;
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }

    // Neon sign text — flicker + "turn on" ramp
    const ramp = smoothstep(0.0, 1.1, t);
    const flick = 0.82 + 0.18*Math.sin(t*33.0) + 0.12*Math.sin(t*71.0);
    const beat = 0.40*bootFlash + 0.25*bootEnergySm;
    const power = clamp(ramp * flick + beat, 0, 1.25);

    const x = a.cx;
    const y = a.cy * 0.88; // Moved up slightly to avoid bottom overlap

    // Tube-lettered company sign (no fonts)
    const tubeH = Math.floor(Math.min(canvas.width, canvas.height) * 0.085);
    drawTubeText('NEO-VECTR INC', x, y, tubeH, 'rgba(175,75,255,ALPHA)', power, 0.18, TITLE_INNER_PALETTE);

    // Subtitle prompt
    ctx.globalCompositeOperation = 'source-over';
    ctx.font = `500 ${Math.floor(tubeH*0.36)}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
    ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.35*ramp})`;
    ctx.fillText('POWERING UP...', x, y + tubeH*1.05);

  function menuLayout(page=menuPage, count=null){
    const a = arena();
    const fs = Math.floor(Math.min(canvas.width, canvas.height) * 0.10);

    // Default font-step scaling per page
    let stepY = fs*0.60;

    // Vertical band available for lists (top after header → bottom before help text)
    // We compute a centered list start so spacing is consistent across menus with different item counts.
    let bandTop = a.cy*0.60;
    let bandBottom = canvas.height - fs*0.55;

    if (page === 'SETTINGS') {
      stepY = fs*0.42;
      bandTop = a.cy*0.66;     // header text takes more space on settings
      bandBottom = canvas.height - fs*0.65;
    }

    if (page === 'PAUSE') {
      stepY = fs*0.50;
      bandTop = a.cy*0.52;
      bandBottom = canvas.height - fs*0.65;
    }

    if (count == null) {
      // Safe fallback: use current menu items length if available, else 4
      try { count = (menuItems && menuItems().length) ? menuItems().length : 4; } catch(e){ count = 4; }
    }

    const listHeight = (Math.max(0, count-1) * stepY);
    const available = Math.max(stepY*1.2, (bandBottom - bandTop));
    let baseY = bandTop + (available - listHeight)/2;

    // Clamp so it never collides with header/help
    baseY = clamp(baseY, bandTop + stepY*0.15, bandBottom - listHeight);

    return {
      fs,
      baseY,
      stepY,
      left: a.cx - fs*2.3,
      right: a.cx + fs*2.3,
      sliderLeft: a.cx - fs*1.35,
      sliderRight: a.cx + fs*1.35,
      bandTop,
      bandBottom,
    };
  }

  
  function drawSettingsScreen(now){
    const a = arena();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,canvas.width, canvas.height);

    const t = now * 0.001;
    const pulse = 0.12 + 0.06*Math.sin(t*2.0);

    const grd = ctx.createRadialGradient(a.cx, a.cy, a.r*0.1, a.cx, a.cy, a.r*1.25);
    grd.addColorStop(0, 'rgba(40,0,70,0.40)');
    grd.addColorStop(1, 'rgba(0,0,0,0.98)');
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,canvas.width, canvas.height);

    const fs = Math.floor(Math.min(canvas.width, canvas.height) * 0.10);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    drawTubeText('SETTINGS', a.cx, a.cy*0.52, Math.floor(fs*0.70), 'rgba(175,75,255,ALPHA)', 0.85 + 0.20*pulse, 0.14, TITLE_INNER_PALETTE);

    ctx.globalCompositeOperation = 'source-over';
    ctx.font = `600 ${Math.floor(fs*0.22)}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillText('Advanced lighting & co-op configuration', a.cx, a.cy*0.61);

    const items = menuItems();
    const layout = menuLayout('SETTINGS', items.length);
    const baseY = layout.baseY;
    const stepY = layout.stepY;

    for (let i=0;i<items.length;i++){
      const y = baseY + i*stepY;
      const isSel = i === menuSel;
      const glow = isSel ? 0.85 + 0.15*Math.sin(t*6.0) : 0.50;
      ctx.globalCompositeOperation = 'lighter';
      ctx.font = `${isSel ? 800 : 650} ${Math.floor(fs*0.30)}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
      ctx.fillStyle = `rgba(120,255,255,${glow})`;
      {
        const label = items[i].labelFn ? items[i].labelFn(now) : items[i].label;
        const metrics = ctx.measureText(label);
        const leftEdge = a.cx - metrics.width*0.5;
        const arrowGap = fs*0.30;
        if (isSel) ctx.fillText('▶', leftEdge - arrowGap, y);
      }
      const label = items[i].labelFn ? items[i].labelFn(now) : items[i].label;
      ctx.fillText(label, a.cx, y);

      // Lightweight slider visualization for selected sliders
      if (isSel && items[i].kind === 'slider') {
        const x0 = layout.sliderLeft;
        const x1 = layout.sliderRight;
        const yBar = y + fs*0.12;
        let tVal = 0.5;
        if (items[i].key === 'players') tVal = clamp((playerCount-1)/7,0,1);
        else if (items[i].key === 'brightness') tVal = clamp(((settings.brightness||0)+0.30)/0.60,0,1);
        else if (items[i].key === 'music') tVal = clamp((settings.musicVol||0),0,1);
        else if (items[i].key === 'sfx') tVal = clamp((settings.sfxVol||0),0,1);

        // track
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(200,170,255,0.18)';
        ctx.beginPath();
        ctx.moveTo(x0, yBar);
        ctx.lineTo(x1, yBar);
        ctx.stroke();

        // filled portion
        ctx.strokeStyle = 'rgba(190,255,255,0.22)';
        ctx.beginPath();
        ctx.moveTo(x0, yBar);
        ctx.lineTo(x0 + (x1-x0)*tVal, yBar);
        ctx.stroke();

        // knob
        const kx = x0 + (x1-x0)*tVal;
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.arc(kx, yBar, 6, 0, Math.PI*2);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.globalCompositeOperation = 'source-over';
    }

    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.font = `500 ${Math.floor(fs*0.22)}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillText('←/→ adjust • ENTER/A select • ESC/B back', a.cx, canvas.height - fs*0.22);

    applyBrightnessPass();
  }
